name: Weekly CBRNE OSINT Dossier

on:
  schedule:
    # Runs every Monday at 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate-dossier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build weekly CBRNE dossiers and update archive
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/build_dossier.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-native.html archive.html archive/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(dossier): publish weekly CBRNE case and archive prior issue"
            git push
          fi
